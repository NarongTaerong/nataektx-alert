name: KTX 취소표 알림

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests korail2

      - name: KTX 취소표 확인
        env:
          KORAIL_ID:        ${{ secrets.KORAIL_ID }}
          KORAIL_PW:        ${{ secrets.KORAIL_PW }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPARTURE:        "부산"
          ARRIVAL:          "서울"
          DATE:             "20260523"
          DEP_TIME:         "060000"
          ARR_TIME:         "090000"
        run: python ktx_checker.py
