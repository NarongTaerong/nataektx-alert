name: KTX 취소표 알림

on:
  schedule:
    # 매 5분마다 실행 (GitHub Actions 최소 단위)
    - cron: "*/5 * * * *"
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: KTX 취소표 확인
        env:
          KORAIL_ID:        ${{ secrets.KORAIL_ID }}
          KORAIL_PW:        ${{ secrets.KORAIL_PW }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ── 아래 값을 원하는 대로 수정하세요 ──
          DEPARTURE:        "부산"
          ARRIVAL:          "서울"
          DATE:             "20260523"   # YYYYMMDD
          DEP_TIME:         "000000"     # 이 시각 이후 열차 조회
        run: python ktx_checker.py
